<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management App</title>

    <!-- Main CSS file -->
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <!-- App header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">📋</span>
                    TaskFlow
                </h1>
                <p class="app-subtitle">Streamline your productivity</p>
            </div>
        </header>

        <main class="main">

            <!-- Input for adding new tasks -->
            <div class="task-input-section">
                <div class="input-container">
                    <input type="text" id="taskInput" placeholder="What task would you like to add?" class="task-input">
                    <select id="priorityInput" class="priority-input" aria-label="Task priority">
                        <option value="high">High priority</option>
                        <option value="medium" selected>Medium priority</option>
                        <option value="low">Low priority</option>
                    </select>
                    <!-- Category picker -->
                    <select id="categorySelect" class="category-select">
                        <option value="personal">📝 Personal</option>
                        <option value="work">💼 Work</option>
                        <option value="shopping">🛒 Shopping</option>
                        <option value="health">🏥 Health</option>
                        <option value="study">📚 Study</option>
                    </select>
                    <!-- Due date picker -->
                    <input type="date" id="dueDateInput" class="due-date-input" title="Due date (optional)">
                    <button id="addTaskBtn" class="add-btn">
                        <span class="add-icon">+</span>
                        Add Task
                    </button>
                </div>
            </div>

            <!-- Search & filter section -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..." aria-label="Search tasks">                </div>
                <div class="filter-row">
                    <div class="quick-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="pending">Pending</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                        <button class="filter-btn" data-filter="today">Created Today</button>
                    </div>
                    <div class="sort-controls">
                        <select id="sortSelect" class="sort-select">
                            <option value="default">Sort: Default</option>
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="az">A → Z</option>
                            <option value="za">Z → A</option>
                        </select>
                        <button id="clearFiltersBtn" class="clear-filters-btn">✖ Clear filters</button>
                    </div>
                </div>
                <p id="searchResultsInfo" class="search-results-info"></p>
            </div>

            <!-- Category filter section -->
            <div class="category-filters">
                <h3>Filter by Category:</h3>
                <div class="category-filter-buttons">
                    <button class="category-filter-btn active" data-category="all">
                        <span class="filter-icon">🔍</span>
                        All Categories
                    </button>
                    <button class="category-filter-btn" data-category="work">
                        <span class="filter-icon">💼</span>
                        Work
                    </button>
                    <button class="category-filter-btn" data-category="personal">
                        <span class="filter-icon">📝</span>
                        Personal
                    </button>
                    <button class="category-filter-btn" data-category="shopping">
                        <span class="filter-icon">🛒</span>
                        Shopping
                    </button>
                    <button class="category-filter-btn" data-category="health">
                        <span class="filter-icon">🏥</span>
                        Health
                    </button>
                    <button class="category-filter-btn" data-category="study">
                        <span class="filter-icon">📚</span>
                        Study
                    </button>
                </div>
            </div>
            <!-- List of tasks -->
            <div class="tasks-section">
                <div class="tasks-header">
                    <h2>Your Tasks</h2>
                    <span id="taskCount" class="task-count">0 tasks</span>
                </div>

                <!-- Due date filters and sorting -->
                <div class="date-controls">
                    <div class="date-filters">
                        <button class="date-filter-btn active" data-date-filter="all">All</button>
                        <button class="date-filter-btn" data-date-filter="today">📅 Due Today</button>
                        <button class="date-filter-btn" data-date-filter="overdue">⚠️ Overdue</button>
                    </div>
                    <label class="date-sort-label">
                        <input type="checkbox" id="sortByDueDate"> Sort by due date
                    </label>
                </div>

                <!-- Tasks are added here using JavaScript -->
                <div id="tasksList" class="tasks-list">
                </div>

                <!-- Shown when there are no tasks -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✨</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task above to get started!</p>
                </div>
            </div>

            <!-- Task statistics -->
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="dueTodayTasks">0</span>
                        <span class="stat-label">Due Today</span>
                    </div>
                    <div class="stat-card stat-overdue">
                        <span class="stat-number" id="overdueTasks">0</span>
                        <span class="stat-label">Overdue</span>
                    </div>
                    <div class="stat-card category-stats">
                        <span class="stat-number" id="categoriesUsed">0</span>
                        <span class="stat-label">Categories</span>
                    </div>
                </div>

                <!-- Category breakdown -->
                <div class="detailed-analytics">
                    <div class="analytics-section">
                        <h3>Category Breakdown</h3>
                        <div id="categoryStats" class="category-stats-list"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 TaskFlow. Built with HTML, CSS, and JavaScript.</p>
        </footer>
    </div>

    <!-- JavaScript for task functionality -->
    <script src="scripts/app.js"></script>
</body>
</html>
